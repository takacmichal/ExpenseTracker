# Included inside nginx's http {} block (conf.d/default.conf), so http-level directives work here.

# Cheap brute-force brake for login/register: 10 requests per minute per client IP.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

server_tokens off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml
               application/problem+json font/ttf application/vnd.ms-fontobject;
    gzip_min_length 1024;

    # Security headers. add_header is NOT inherited by a location that sets its own add_header,
    # so every location below that has its own add_header repeats these lines. The /api
    # locations have none and inherit them.
    # CSP: the production build has no inline scripts (inlineCritical is off in angular.json,
    # which would otherwise emit an onload= handler); 'unsafe-inline' for styles is needed
    # because PrimeNG injects <style> tags and style attributes at runtime.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS only makes sense once the site is served over HTTPS (compose serves plain HTTP on :80).
    # Enable it on the TLS-terminating server/proxy, never on plain HTTP:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hashed bundles, styles and fonts (outputHashing: all) are immutable.
    location ~* \.(?:js|mjs|css|woff2?|ttf|eot|svg)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback; index.html (and the unhashed favicon) must always be revalidated.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
