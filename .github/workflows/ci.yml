name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven, JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Tests are pure unit tests today (no Spring context, no database).
      - name: Test
        run: ./mvnw -B test

  frontend:
    name: Frontend (Angular build + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Angular 22 requires Node ^22.22.3 || ^24.15.0; matches node:24.15-alpine in the Dockerfile.
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # The PrimeNG licence is not needed to compile; it is only injected into Docker images.
      - name: Build
        run: npm run build

      - name: Test
        run: npx ng test --watch=false
